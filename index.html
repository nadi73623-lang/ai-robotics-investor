<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111e"><meta name="description" content="AI Robotics Investor 4.2.1 – monitoring AI i robotyki"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><title>AI Robotics Investor</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f3ff;background:#09111e}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#67cfff}header{position:sticky;top:0;z-index:2;background:#09111eea;backdrop-filter:blur(12px);border-bottom:1px solid #26364a;padding:16px max(16px,calc((100vw - 740px)/2))}header strong{font-size:17px}header small{display:block;color:#92a7c0;margin-top:3px}main{max-width:740px;margin:auto;padding:20px 16px 112px}.card{background:#142236;border:1px solid #263a52;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#9fb0c7;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:25px;font-weight:800;margin:7px 0}.chip{font-size:11px;padding:5px 9px;border-radius:30px;background:#1d3951;color:#91d8ff;display:inline-block}.warning{background:#3a2c1c;border:1px solid #67502d;border-radius:12px;padding:12px;color:#ffdb99;font-size:12px;line-height:1.5}h1{font-size:25px;margin:8px 0}h2{font-size:18px;margin:18px 0 8px}.stock{display:flex;align-items:center;justify-content:space-between;gap:10px}.stock strong{font-size:17px}.stock p{margin:4px 0}.action{border:1px solid #386083;background:#1b3956;color:#e8f5ff;padding:9px 12px;border-radius:10px}.primary{background:#147db8;border-color:#147db8}input{background:#101e30;color:white;border:1px solid #39516d;padding:13px;border-radius:12px;width:100%;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#101d30;border-top:1px solid #30425b;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:4}nav button{background:none;border:0;color:#8ea8c5;flex:1;max-width:150px;font-size:12px;padding:8px 0}nav button.active{color:#65d0ff;font-weight:800}.tag{display:inline-block;background:#253750;border-radius:7px;padding:4px 7px;font-size:11px;margin:3px}.link{display:block;text-decoration:none;padding:8px 0;border-bottom:1px solid #29415a;line-height:1.35;font-size:13px}.empty{padding:30px 10px;text-align:center;color:#9fb0c7}select{background:#13253b;color:#eaf6ff;padding:9px;border:1px solid #385472;border-radius:9px;max-width:100%}
</style></head><body><header><strong>◈ AI Robotics Investor <span class="chip">4.2.1</span></strong><small>Autonomiczny monitoring AI i robotyki</small></header><main id="app"><p>Ładowanie aplikacji…</p></main><nav id="nav"></nav><script>
const fallback={generated_at:null,articles_collected:0,companies:[{ticker:'AVGO',name:'Broadcom',sector:'AI infrastructure',mentions:0,news:[]},{ticker:'PDYN',name:'Palladyne AI',sector:'Robotics',mentions:0,news:[]},{ticker:'NVDA',name:'NVIDIA',sector:'AI chips',mentions:0,news:[]},{ticker:'SYM',name:'Symbotic',sector:'Warehouse robotics',mentions:0,news:[]}],discoveries:[],articles:[]};
let data=fallback,live=false,tab='home',search='',sector='Wszystkie';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let watched;try{watched=JSON.parse(localStorage.getItem('robotics-watch')||'[]')}catch{watched=[]}if(!Array.isArray(watched))watched=[];
function save(){localStorage.setItem('robotics-watch',JSON.stringify(watched))}function toggle(t){watched=watched.includes(t)?watched.filter(x=>x!==t):[...watched,t];save();render()}
function dateLabel(){if(!data.generated_at)return 'Brak aktualnego skanu';return new Date(data.generated_at).toLocaleString('pl-PL',{dateStyle:'medium',timeStyle:'short'})}
function money(x){if(x===null||x===undefined)return '—';return new Intl.NumberFormat('pl-PL',{notation:'compact',maximumFractionDigits:2}).format(x)+' USD'}
function priceCard(c){let p=c.price;if(!p)return '<p class="muted">Cena: brak potwierdzonego notowania.</p>';return `<p class="muted">Cena zamknięcia: <b>${Number(p.close_usd).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:4})} USD</b> · ${esc(p.date)}<br><span class="tag">Opóźniona / nie na żywo</span> <a href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">${esc(p.source||"Źródło")} ↗</a></p>`}
function financial(c){let f=c.fundamentals;if(!f)return '<p class="muted">Dane SEC: jeszcze nie pobrano lub emitent nie raportuje w SEC.</p>';return `<div class="muted" style="margin-top:10px"><b>Finanse SEC · rok ${esc(f.fiscal_year||'—')}</b><div class="grid" style="margin-top:7px"><div>Przychód<br><b>${money(f.revenue_usd)}</b></div><div>Wzrost r/r<br><b>${f.revenue_growth_pct??'—'}%</b></div><div>Marża netto<br><b>${f.net_margin_pct??'—'}%</b></div><div>Wolne przepływy<br><b>${money(f.free_cash_flow_usd)}</b></div></div><p>Filtr kondycji: <b>${f.financial_health_score===null?'Brak kompletu danych':f.financial_health_score+'/100'}</b> · nie jest oceną zakupu</p><a href="${esc(f.source_url)}" target="_blank" rel="noopener">Źródło: SEC ↗</a></div>`}
function valuationCard(c){let v=c.valuation;if(!v||v.status!=='partial')return '<p class="muted">Wycena orientacyjna: brak zgodnych danych o cenie i liczbie akcji.</p>';let fmt=x=>x===null||x===undefined?'—':Number(x).toLocaleString('pl-PL',{maximumFractionDigits:2});return `<div class="muted" style="margin-top:10px"><b>Wycena orientacyjna · nie sygnał zakupu</b><div class="grid" style="margin-top:7px"><div>Kapitalizacja*<br><b>${money(v.market_cap_usd)}</b></div><div>P/S (roczny)<br><b>${fmt(v.ps)}</b></div><div>P/E (roczny)<br><b>${fmt(v.pe)}</b></div><div>FCF yield (roczny)<br><b>${v.fcf_yield_pct===null?'—':fmt(v.fcf_yield_pct)+'%'}</b></div></div><p>* Cena zamknięcia ${esc(v.price_date)} × akcje SEC na ${esc(v.share_date)}. Możliwe rozwodnienie i nieporównywalność okresów. Brak danych nie oznacza zera.</p></div>`}
function stock(c){return `<article class="card"><div class="stock"><div><strong>${esc(c.ticker)}</strong> · ${esc(c.name)}<p class="muted">${esc(c.sector)}</p></div><button class="action" onclick="toggle('${esc(c.ticker)}')" aria-label="Obserwuj ${esc(c.ticker)}">${watched.includes(c.ticker)?'★':'☆'}</button></div><div class="muted">Wzmianki: <b>${c.mentions||0}</b> · Wskaźnik uwagi: <b>${c.attention_score??'—'}/100</b></div><p class="muted">Wycena: ${esc(c.valuation_status||'Brak danych finansowych')}</p>${priceCard(c)}${valuationCard(c)}${financial(c)}${(c.news||[]).slice(0,2).map(n=>`<a class="link" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)} ↗</a>`).join('')}<button class="action" style="margin-top:10px" onclick="notes('${esc(c.ticker)}')">Moja notatka</button></article>`}
function notes(t){let v=localStorage.getItem('robotics-note-'+t)||'';let n=prompt('Notatka do '+t,v);if(n!==null)localStorage.setItem('robotics-note-'+t,n)}
function render(){const tabs=[['home','⌂','Start'],['scan','◎','Skaner'],['watch','★','Obserwowane'],['discover','✧','Odkrycia'],['news','▤','Wiadomości']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${icon}<br>${label}</button>`).join('');let html='';const banner=`<div class="warning">${live?'Dane z ostatniego udanego skanu.':'Tryb demonstracyjny / offline: nie pobrano aktualnego skanu.'} Wskaźnik uwagi nie jest oceną wyceny ani prognozą zwrotu. Dane finansowe SEC są stopniowo uzupełniane. Notowania są historycznymi cenami zamknięcia, nie danymi na żywo. Wyceny są orientacyjne, oparte na rocznych danych SEC i historycznej liczbie akcji. Brak pełnego pokrycia rynku.</div>`;
if(tab==='home'){html=`<h1>Centrum rynku AI</h1><p class="muted">Ostatni skan: ${esc(dateLabel())}</p>${banner}<div class="grid"><div class="card"><div class="muted">Spółki w bazie</div><div class="metric">${data.companies.length}</div></div><div class="card"><div class="muted">Zebrane wiadomości</div><div class="metric">${data.articles_collected||0}</div></div></div><h2>Najczęściej wspominane (nie ranking zakupowy)</h2><p class="muted">Dane SEC: ${data.financial_coverage??0} spółek · Ceny zamknięcia: ${data.price_coverage??0} spółek · Wycena orientacyjna: ${data.valuation_coverage??0} spółek. Brak cen i fundamentów oznacza brak pokrycia, nie ocenę negatywną.</p>${data.companies.slice(0,6).map(stock).join('')}<button class="action primary" onclick="go('scan')">Zobacz cały skaner →</button>`}
if(tab==='scan'){let sectors=['Wszystkie',...new Set(data.companies.map(x=>x.sector))];let cs=data.companies.filter(c=>(sector==='Wszystkie'||c.sector===sector)&&(`${c.ticker} ${c.name} ${c.sector}`.toLowerCase().includes(search.toLowerCase())));html=`<h1>Skaner spółek</h1><p class="muted">Sortowanie według liczby wzmianek, nie potencjału inwestycyjnego. Pod kartami spółek znajdują się dane finansowe SEC, gdy są dostępne.</p>${banner}<input id="search" placeholder="Szukaj nazwy lub tickera" value="${esc(search)}" oninput="search=this.value;updateResults()"><select id="sector" onchange="sector=this.value;updateResults()">${sectors.map(s=>`<option ${sector===s?'selected':''}>${esc(s)}</option>`).join('')}</select><div id="results">${cs.map(stock).join('')||'<p class="empty">Brak wyników</p>'}</div><p class="muted">Nowych kandydatów znajdziesz w zakładce Odkrycia.</p>`}
if(tab==='discover'){let ds=data.discoveries||[];let cards=ds.map(c=>`<article class="card"><strong>${esc(c.ticker)} · ${esc(c.name)}</strong><p class="muted">${esc(c.public_listing)} · ${c.mentions} wzmianek</p>${(c.news||[]).map(n=>`<a class="link" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)} ↗</a>`).join('')}</article>`).join('');html=`<h1>Odkrywanie nowych spółek</h1><p class="muted">Kandydaci spoza listy startowej wykryci w nagłówkach i dopasowani do rejestru SEC. Nie jest to pełny skan giełd.</p>${banner}<div class="card"><b>${ds.length} kandydatów</b><p class="muted">Status i ticker należy zweryfikować przed inwestycją.</p></div>${cards||'<p class="empty">Brak nowych kandydatów w tym skanie.</p>'}`}
if(tab==='watch'){let cs=data.companies.filter(c=>watched.includes(c.ticker));html=`<h1>Obserwowane</h1><p class="muted">Zapisane na tym telefonie: ${watched.length}</p>${cs.map(stock).join('')||'<p class="empty">Dodaj spółki gwiazdką ☆ w skanerze.</p>'}<button class="action" onclick="exportData()">Eksportuj moje dane</button><p class="muted">Eksport zawiera obserwowane i wszystkie zapisane notatki. Zachowaj plik przed zmianą telefonu.</p>`}
if(tab==='news'){html=`<h1>Wiadomości</h1><p class="muted">Źródło: Google News RSS · Ostatni skan: ${esc(dateLabel())}</p>${banner}${(data.articles||[]).map(n=>`<div class="card"><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><p class="muted">${esc(n.date||'')}</p></div>`).join('')||'<p class="empty">Brak wiadomości. Po uruchomieniu automatycznego skanera pojawią się tutaj.</p>'}`}
$('app').innerHTML=html}
function updateResults(){let cs=data.companies.filter(c=>(sector==='Wszystkie'||c.sector===sector)&&(`${c.ticker} ${c.name} ${c.sector}`.toLowerCase().includes(search.toLowerCase())));$('results').innerHTML=cs.map(stock).join('')||'<p class="empty">Brak wyników</p>'}
function go(x){tab=x;render();window.scrollTo(0,0)}function exportData(){let keys=Object.keys(localStorage).filter(k=>k.startsWith('robotics-note-'));let obj={watchlist:watched,notes:Object.fromEntries(keys.map(k=>[k.slice(14),localStorage.getItem(k)||'']))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download='ai-robotics-moje-dane.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function init(){try{let r=await fetch('./data/scan.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();if(!Array.isArray(j.companies))throw Error('invalid data');data=j;live=j.scan_status==='ok'}catch(e){console.warn('Brak danych skanera:',e)}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}init();
</script></body></html>
