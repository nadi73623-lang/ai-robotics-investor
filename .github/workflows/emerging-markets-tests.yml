name: Emerging Markets Discovery tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'emerging_markets.py'
      - 'test_emerging_markets.py'
      - 'scanner.py'
      - '.github/workflows/emerging-markets-tests.yml'
  push:
    branches: [feature/emerging-markets-discovery]
    paths:
      - 'emerging_markets.py'
      - 'test_emerging_markets.py'
      - 'scanner.py'
      - '.github/workflows/emerging-markets-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile emerging_markets.py scanner.py test_emerging_markets.py
      - name: Run discovery tests
        run: python -m unittest -v test_emerging_markets
