name: Deploy read-only Robotics Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: robotics-worker-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-balanced-1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment inputs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READ_TOKEN: ${{ secrets.ROBOTICS_READ_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          test -n "$READ_TOKEN"
          grep -q 'id = "35a4ec24211540fa9a098923773d667f"' private_sync_worker/wrangler.robotics-report.toml
      - name: Test Worker before deployment
        run: node --test tests/robotics_report_worker.test.mjs
      - name: Deploy Worker
        working-directory: private_sync_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READ_TOKEN: ${{ secrets.ROBOTICS_READ_TOKEN }}
        run: |
          npx --yes wrangler@4 secret put READ_TOKEN --config wrangler.robotics-report.toml <<< "$READ_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler.robotics-report.toml
