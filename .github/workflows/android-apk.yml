name: Stage2 Android APK

on:
  push:
    branches: [stage2-balanced-1.3.4]
    paths:
      - "android/**"
      - "private_sync_worker/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test read-only Worker
        run: node --test tests/robotics_report_worker.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Stage2 release metadata
        run: python android/verify_stage2.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Verify APK and calculate SHA-256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Robotics-Investor-0.1.231-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
