name: Balanced 1.3 isolated validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'balanced_strategy.py'
      - 'test_balanced_strategy_repair.py'
      - 'baseline/**'
      - '.github/workflows/balanced-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline and Balanced 1.3 decision gates
        run: python -m unittest -v test_balanced_strategy_repair.py
